<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>COLORÉ - Diversión, Slime & Helados</title>
    <style>
        :root {
            --neon-pink: #ff007f;
            --neon-cyan: #00ffff;
            --neon-green: #39ff14;
            --dark-bg: #07090f;
            --glass-bg: rgba(20, 20, 30, 0.6);
        }

        body {
            margin: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--dark-bg); color: #ffffff; overflow-x: hidden; scroll-behavior: smooth;
        }

        /* Navegación */
        nav {
            position: fixed; top: 0; width: 100%; background: rgba(7, 9, 15, 0.9);
            backdrop-filter: blur(10px); display: flex; justify-content: center;
            align-items: center; padding: 15px 0; z-index: 1000; box-shadow: 0 2px 20px rgba(255, 0, 127, 0.2); gap: 30px;
        }
        nav a { color: #fff; text-decoration: none; font-weight: bold; cursor: pointer; text-transform: uppercase; transition: 0.3s; }
        nav a:hover { color: var(--neon-cyan); text-shadow: 0 0 10px var(--neon-cyan); }
        .nav-logo { height: 70px; border-radius: 15px; box-shadow: 0 0 15px var(--neon-pink); }

        #vista-principal { display: block; }
        #vista-heladeria { display: none; padding-top: 120px; min-height: 100vh; text-align: center; }

        /* Portada y Mascota */
        .hero {
            min-height: 100vh; display: flex; align-items: center; justify-content: center;
            padding: 100px 20px 20px 20px; gap: 50px; flex-wrap: wrap;
        }
        .hero-text { max-width: 500px; }
        .hero-text h1 { font-size: 3.5rem; text-shadow: 0 0 10px var(--neon-pink), 0 0 20px var(--neon-pink); }
        
        .mascot-container { animation: walkIn 1.5s ease-out forwards, float 3s ease-in-out infinite alternate 1.5s; opacity: 0; }
        .mascot-img { width: 350px; filter: drop-shadow(0 0 25px var(--neon-cyan)); }

        @keyframes walkIn {
            0% { transform: translateX(-150vw) rotate(-10deg); opacity: 0; }
            80% { transform: translateX(10px) rotate(5deg); opacity: 1; }
            100% { transform: translateX(0) rotate(0deg); opacity: 1; }
        }
        @keyframes float { 0% { transform: translateY(0px); } 100% { transform: translateY(-20px); } }

        /* Heladería y Toppings */
        .flavors-container, .toppings-container {
            display: flex; justify-content: center; gap: 30px; flex-wrap: wrap; margin-top: 30px;
        }
        .flavor-item {
            width: 150px; height: 150px; border-radius: 50%; display: flex; justify-content: center; align-items: center;
            font-size: 1.2rem; font-weight: bold; cursor: pointer; transition: 0.3s; border: 4px solid #fff;
        }
        .flavor-chocolate { background: linear-gradient(145deg, #6b4321, #3a2210); box-shadow: 0 0 20px #6b4321; }
        .flavor-limon { background: linear-gradient(145deg, #a3ff47, #5eb800); box-shadow: 0 0 20px #8cff2b; color: #000; }
        .flavor-fresa { background: linear-gradient(145deg, #ff66b3, #cc0066); box-shadow: 0 0 20px #ff3399; }
        .flavor-item:hover { transform: scale(1.1); }

        .topping-btn {
            background: var(--glass-bg); color: #fff; border: 2px solid var(--neon-cyan);
            padding: 15px 25px; border-radius: 20px; cursor: pointer; font-size: 1.1rem; transition: 0.3s;
        }
        .topping-btn:hover { background: var(--neon-cyan); color: #000; box-shadow: 0 0 15px var(--neon-cyan); }

        /* Animación del Helado Final */
        @keyframes jumpSpin {
            0% { transform: translateY(0) rotate(0deg); }
            30% { transform: translateY(-80px) rotate(180deg); }
            50% { transform: translateY(0) rotate(360deg); }
            70% { transform: translateY(-30px) rotate(360deg); }
            100% { transform: translateY(0) rotate(360deg); }
        }
        @keyframes wave { 0%, 100% { transform: rotate(0deg); } 50% { transform: rotate(30deg); } }

        .ice-cream-character {
            width: 160px; height: 160px; border-radius: 50% 50% 10% 10%;
            position: relative; margin: 40px auto 0; display: none;
            box-shadow: inset -10px -10px 20px rgba(0,0,0,0.3), 0 0 30px rgba(255,255,255,0.2);
        }
        .eyes { font-size: 45px; position: absolute; top: 30%; left: 50%; transform: translateX(-50%); }
        .arm { font-size: 45px; position: absolute; top: 40%; right: -40px; animation: wave 0.8s infinite alternate; }
        .topping-deco { font-size: 55px; position: absolute; top: -25px; left: 50%; transform: translateX(-50%); }
        
        .cono {
            width: 0; height: 0; border-left: 60px solid transparent; border-right: 60px solid transparent;
            border-top: 120px solid #d4a373; margin: 0 auto; display: none; filter: drop-shadow(0 10px 10px rgba(0,0,0,0.5));
        }
    </style>
</head>
<body>

    <nav>
        <a onclick="mostrarPrincipal()">Inicio</a>
        <a onclick="mostrarPrincipal()"><img src="image1.jpeg" alt="Logo" class="nav-logo"></a>
        <a onclick="mostrarHeladeria()">Heladería</a>
    </nav>

    <!-- VISTA PRINCIPAL -->
    <div id="vista-principal">
        <header class="hero">
            <div class="hero-text">
                <h1>COLORÉ LAB<br>& KIDS</h1>
                <p style="font-size: 1.2rem; color: #ccc;">Donde la imaginación crea diversión sin límites.</p>
                <button class="topping-btn" onclick="mostrarHeladeria()">Ir a la Heladería</button>
            </div>
            <div class="mascot-container">
                <!-- NOTA: Cambiado a .png para cuando le quites el fondo -->
                <img src="image0.png" alt="Mascota" class="mascot-img">
            </div>
        </header>
    </div>

    <!-- VISTA HELADERÍA -->
    <div id="vista-heladeria">
        <h2 style="color: #fff; text-shadow: 0 0 15px var(--neon-pink); font-size: 2.5rem;">BARRA DE SABORES</h2>
        <p id="instruccion" style="font-size: 1.2rem; color: #ccc;">1. Elige tu sabor favorito</p>
        
        <!-- Paso 1: Sabores -->
        <div class="flavors-container" id="seccion-sabores">
            <div class="flavor-item flavor-chocolate" onclick="seleccionarSabor('Chocolate', 'linear-gradient(145deg, #6b4321, #3a2210)')">Chocolate</div>
            <div class="flavor-item flavor-limon" onclick="seleccionarSabor('Limón', 'linear-gradient(145deg, #a3ff47, #5eb800)')">Limón</div>
            <div class="flavor-item flavor-fresa" onclick="seleccionarSabor('Fresa', 'linear-gradient(145deg, #ff66b3, #cc0066)')">Fresa</div>
        </div>

        <!-- Paso 2: Toppings (Oculto al inicio) -->
        <div id="seccion-toppings" style="display: none; margin-top: 40px;">
            <p style="font-size: 1.2rem; color: var(--neon-cyan);">2. ¡Agrega un Topping!</p>
            <div class="toppings-container">
                <button class="topping-btn" onclick="crearHelado('Galleta', '🍪')">🍪 Galleta</button>
                <button class="topping-btn" onclick="crearHelado('Chispas', '🍫')">🍫 Chispas</button>
                <button class="topping-btn" onclick="crearHelado('Fresas', '🍓')">🍓 Fresas frescas</button>
                <button class="topping-btn" onclick="crearHelado('M&Ms', '🍬')">🍬 M&Ms</button>
            </div>
        </div>

        <!-- Paso 3: El Helado Animado -->
        <div id="resultado-helado" style="display: none; margin-top: 40px; padding-bottom: 50px;">
            <div id="ice-cream-char" class="ice-cream-character">
                <div class="topping-deco" id="topping-visual">🍪</div>
                <div class="eyes">👀</div>
                <div class="arm">👋</div>
            </div>
            <div class="cono" id="cono-visual"></div>
            <h3 id="helado-msg" style="color: var(--neon-green); margin-top: 30px; font-size: 1.8rem;"></h3>
            <button class="topping-btn" style="margin-top: 20px; border-color: var(--neon-pink);" onclick="reiniciarHeladeria()">Crear otro helado</button>
        </div>
    </div>

    <script>
        let saborElegido = '';
        let colorSabor = '';

        function mostrarHeladeria() {
            document.getElementById('vista-principal').style.display = 'none';
            document.getElementById('vista-heladeria').style.display = 'block';
            window.scrollTo(0, 0);
        }

        function mostrarPrincipal() {
            document.getElementById('vista-heladeria').style.display = 'none';
            document.getElementById('vista-principal').style.display = 'block';
        }

        function seleccionarSabor(sabor, color) {
            saborElegido = sabor;
            colorSabor = color;
            document.getElementById('seccion-toppings').style.display = 'block';
            document.getElementById('instruccion').innerText = `Sabor seleccionado: ${sabor} 🍨`;
            document.getElementById('resultado-helado').style.display = 'none';
        }

        function crearHelado(toppingNombre, toppingEmoji) {
            const character = document.getElementById('ice-cream-char');
            const cono = document.getElementById('cono-visual');
            const msg = document.getElementById('helado-msg');
            
            // Configurar colores y emojis
            character.style.background = colorSabor;
            document.getElementById('topping-visual').innerText = toppingEmoji;
            
            // Mostrar elementos
            document.getElementById('resultado-helado').style.display = 'block';
            character.style.display = 'block';
            cono.style.display = 'block';
            msg.innerText = `¡Hola! Soy tu helado de ${saborElegido} con ${toppingNombre} ✨`;
            
            // Forzar el reinicio de la animación para que salte cada vez que eligen uno nuevo
            character.style.animation = 'none';
            void character.offsetWidth; // Truco para reiniciar CSS
            character.style.animation = 'jumpSpin 1.5s ease-out';
            
            // Hacer scroll suave hacia el helado
            document.getElementById('resultado-helado').scrollIntoView({ behavior: 'smooth' });
        }

        function reiniciarHeladeria() {
            document.getElementById('seccion-toppings').style.display = 'none';
            document.getElementById('resultado-helado').style.display = 'none';
            document.getElementById('instruccion').innerText = "1. Elige tu sabor favorito";
            window.scrollTo(0, 0);
        }
    </script>
</body>
</html>
